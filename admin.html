<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — DVLA Attachment Portal</title>
  <link rel="icon" type="image/jpeg" href="assets/dvla-logo.jpg" />
  <link rel="apple-touch-icon" href="assets/dvla-logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js",
        "firebase/analytics": "https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics.js"
      }
    }
  </script>
</head>
<body>
  <div class="top-strip">
    <div class="wrap">
      <span>A service of the Driver &amp; Vehicle Licensing Authority, Ghana</span>
      <span class="top-contact">Call Center: 030 276 2449</span>
    </div>
  </div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <img src="assets/dvla-logo.jpg" alt="DVLA Ghana logo" width="56" height="56" />
        <span class="brand-text">
          <strong>DVLA Ghana</strong>
          <span>Driver &amp; Vehicle Licensing Authority</span>
        </span>
      </a>
      <nav class="main-nav" aria-label="Main navigation" id="main-nav">
        <a href="index.html">Apply</a>
        <a href="admin.html" class="active">Admin Login</a>
      </nav>
      <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Open menu">
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
    </div>
  </header>
  <div class="nav-scrim" hidden></div>
  <section class="hero hero-slim">
    <div class="wrap">
      <p class="hero-kicker">Staff only</p>
      <h1>Admin Dashboard</h1>
    </div>
  </section>
  <main class="wrap admin-main">
    <section id="login-section" class="card">
      <h2>Login</h2>
      <form id="login-form">
        <label>Email <input name="email" type="email" required autocomplete="username" /></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password" /></label>
        <button type="submit" class="cta">Log in</button>
      </form>
    </section>
    <section id="dashboard-section" class="card" hidden>
      <h2>Submissions</h2>
      <div class="filters">
        <select id="status-filter" aria-label="Filter by status">
          <option value="">All</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
        <input id="search" placeholder="Search name / school / company" aria-label="Search submissions" />
      </div>
      <div id="submissions-list"></div>
      <div id="submission-detail"></div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-base">
      <div class="wrap">&copy; 2026 Driver and Vehicle Licensing Authority. All rights reserved. | Privacy Policy</div>
    </div>
  </footer>
  <script type="module" src="js/admin.js"></script>
  <script src="js/nav.js" defer></script>
</body>
</html>
